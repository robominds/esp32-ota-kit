; esp32-ota-kit development project. Consumers do not use this file; they add
; the library through lib_deps (see README.md).
;   pio test -e native    host tests: otacore and the timing helpers
;   pio run  -e example   compiles examples/basic for an ESP32-S3, linking the
;                         library as an archive the way consumers do

[platformio]
src_dir = examples/basic

[env:example]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
board     = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.psram_type          = opi
custom_fw_version = 0.0.1
build_flags =
    -DEXAMPLE_FW_VERSION='"${this.custom_fw_version}"'
; The library itself, built as an archive exactly as a consuming project builds it.
lib_deps = symlink://${PROJECT_DIR}

[env:native]
platform         = native
build_flags      = -std=c++17 -Wall -Wextra -I src
; Only the pure C++ parts build on the host: otacore.cpp (the path is relative
; to src_dir) and the header-only detail/timing.h.
build_src_filter = -<*> +<../../src/otacore.cpp>
test_build_src   = yes
lib_compat_mode  = off
lib_deps         = bblanchon/ArduinoJson @ ^7.0.0
